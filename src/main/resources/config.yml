# 原始像素实验版：不调用 ImageSampler；max-points、particle-spacing、max-grid-cells 忽略。
# 高风险实验配置（映射）；仅管理员手工编辑服务器 config.yml 并 reload 开启。
experimental:
  # 布尔值，默认 false；true 允许超过正常预算的完整原始像素帧，可能卡死客户端/服务端或断线。
  # false 时预算不足整帧拒绝并报错；从 true 改回 false 并 reload 会停止所有在播演出。
  allow-over-budget-full-frames: true
# UTF-8 中文配置。游戏 tick 按服务器时钟计算；20 TPS 时 20 tick 约为 1 秒。
# 每个达到阈值的非透明原始像素对应一个点；缩放/旋转只改变坐标，不改变点数。
# 显示与运行限制（映射）；以下数值为默认配置，所有 Show/Track/Clip 共用。
display:
  # 整数，默认 2，范围 1～20，单位游戏 tick；图片发射间隔，不改变演出时钟。
  frame-period-ticks: 2
  # 有限数值，默认 48，范围 1～128，单位方块；仅同世界范围内在线玩家接收粒子。
  view-distance-blocks: 48
  # 整数，默认 1500，范围 1～10000，单位粒子发送次数/游戏 tick；按点×观众计费，彩色优先，GLOW 使用剩余额度。
  max-particles-per-tick: 1500
  # 整数，默认 6，范围 1～32，单位场；同时在播 Show 上限。
  max-active-shows: 6
  # 整数，默认 2，范围 1～16，单位场/玩家；预览与玩家触发演出共用。
  max-shows-per-player: 2
  # 整数，默认 128，范围 1～512；所有在播 Show 的计划 Clip 总量上限，包含未开始片段，直到所属 Show 结束才释放。
  max-active-clips: 128
# 图片输入安全与预处理限制（映射）；原图分辨率不直接决定粒子数。
image:
  # 整数，默认 16777216（16 MiB），范围 1～16777216，单位字节/PNG；完整解码前检查文件大小。
  max-file-bytes: 16777216
  # 整数，默认 4096，范围 1～8192，单位像素；解码前检查原始宽度，不决定点数。
  max-width: 4096
  # 整数，默认 4096，范围 1～8192，单位像素；解码前检查原始高度，不决定点数。
  max-height: 4096
  # 整数，默认 4194304，范围 1～16777216，单位像素/PNG；支持 2048×2048 和原样 1254×1254 Logo。
  max-pixels: 4194304
  # 整数，默认 67108864（64 MiB），范围 1048576～268435456，单位估算字节；按原图每像素 8 字节预留解码工作内存，只保留一张原图。
  max-decoded-bytes: 67108864
  # 整数，默认 67108864，范围 1～268435456，单位累计解码像素/重载；切换原图再次解码也计费。
  max-decoded-pixels: 67108864
  # 整数，默认 134217728，范围 1～536870912，单位估算像素访问/重载；限制多采样变体的总处理工作。
  max-pixel-visits: 134217728
  # 整数，默认 262144，范围 1～262144，实验版忽略旧网格限制；完整点云改由 max-cached-points 限制。
  max-grid-cells: 262144
  # 整数，默认 512，范围 1～2048，单位点云变体/重载；相同参数共享，不每 tick 解码。
  max-sampling-variants: 512
  # 整数，默认 2000000，范围 1～2000000，单位原始像素点/重载；超限拒绝整图、不截断。每点约 64～80 字节并有排序临时开销，须预留充足堆。
  max-cached-points: 2000000
  # 整数，默认 128，范围 1～256，单位原图/重载；原图只缓存尺寸元数据，不长期缓存全部 BufferedImage。
  max-sources: 128
  # 整数，默认 10000，范围 100～60000，单位毫秒/重载；阶段和采样行间检查，不承诺中断单次文件系统 I/O。
  max-preprocess-millis: 10000
  # 整数，默认 700，范围 1～5000；实验版忽略旧点数限制，绝不截断原始像素。
  max-points: 700
  # 整数，默认 16，范围 0～255；图片未单独配置 alpha-threshold 时使用，完全透明仍始终排除。
  default-alpha-threshold: 16
  # 有限数值，默认 0.9，范围 0.01～4；图片未配置 dust-size 时使用。
  default-dust-size: 0.9
# 预览位置配置（映射）；仅影响命令预览，不修改实体和世界光照。
preview:
  # 有限数值，默认 8，范围 1～32，单位方块；沿玩家视线放置预览原点。
  distance-blocks: 8.0
  # 有限数值，默认 1，范围 -10～20，单位方块；预览原点额外高度。
  height-offset-blocks: 1.0
