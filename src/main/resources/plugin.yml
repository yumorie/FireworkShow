name: FireworkShow
description: Configurable ParticleLib and transparent PNG firework shows
version: '${version}'

main: com.yumorie.fireworkshow.FireworkShow
api-version: '26.2'
load: POSTWORLD

authors: [ yumorie ]

depend:
  - ParticleLib

commands:
  fws:
    description: Manage firework shows
    aliases: [fireworkshow]
    usage: /fws help
permissions:
  fireworkshow.use:
    default: true
  fireworkshow.admin:
    default: op
    children:
      fireworkshow.use: true
