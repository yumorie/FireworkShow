      rotation: {x: 0, y: 0, z: 0}
      # 有限正数，默认 1，范围 0.05～20；以自身局部原点缩放，父子比例相乘，影响子位移和显示尺寸，但不影响点数。
      scale: 0.75
    # 片段列表（必填，1～64 项/轨，最多 128 项/Show）；独立起止，时间区间可重叠，共用父 Track 变换。
