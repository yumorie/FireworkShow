id: heart
display-name: '&dHeart Firework'
image:
  file: heart.png
  width-blocks: 5.0
  alpha-threshold: 16
  max-points: 600
  dust-size: 0.9
  orientation: face-trigger
timeline:
  - type: particlelib
    duration-ticks: 30
    effect:
      class: tornado
      particle: FLAME
      period: 2
      iterations: -1
      tornadoHeight: 4.0
      maxTornadoRadius: 2.5
      circleParticles: 8
      cloudParticles: 10
      showCloud: true
  - type: reveal
    duration-ticks: 40
    mode: center-out
    initial-scale: 0.15
    easing: ease-out-cubic
  - type: hold
    duration-ticks: 40
  - type: scatter
    duration-ticks: 50
    radius-blocks: 4.0
    easing: ease-in-cubic
    fade-out: true
